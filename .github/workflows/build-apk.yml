name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install
          npm install -g eas-cli expo-cli
      
      - name: Build APK
        run: |
          npm run build
        env:
          NODE_ENV: production
      
      - name: Create dummy APK for testing
        run: |
          mkdir -p ./dist
          echo "APK placeholder - use Expo Go or EAS Build for actual APK" > ./dist/bizu-do-cadete.apk
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bizu-do-cadete
          path: ./dist/
          retention-days: 30
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            # Bizu do Cadete - Release v${{ github.run_number }}
            
            **Alterações:**
            - ✅ Preço de assinatura: R$ 5,00/mês
            - ✅ Tela de login atualizada
            - ✅ Múltiplas formas de pagamento
            
            ## Como testar o app:
            
            ### Opção 1: Expo Go (Mais Rápido)
            1. Instale o app "Expo Go" no seu celular
            2. Acesse: https://expo.dev/@seu-usuario/bizu-do-cadete
            3. Escaneie o QR code
            
            ### Opção 2: APK (Versão Completa)
            1. Use EAS Build: `eas build --platform android --type apk`
            2. Ou use Android Studio para compilar localmente
            
            ## Credenciais de Teste:
            - Email: teste@test.com
            - Senha: 123456
          draft: false
          prerelease: false
