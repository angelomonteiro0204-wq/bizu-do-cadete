name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo
        run: npm install -g expo-cli
      
      - name: Build APK with Expo
        run: |
          expo build:android --non-interactive --type apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: Upload APK to Release
        uses: actions/upload-artifact@v3
        with:
          name: bizu-do-cadete.apk
          path: ./app-*.apk
          retention-days: 30
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            APK gerado automaticamente via GitHub Actions
            
            **Alterações:**
            - Preço de assinatura: R$ 5,00/mês
            - Tela de login atualizada
            - Múltiplas formas de pagamento
            
            Baixe o APK abaixo e instale no seu dispositivo Android.
          draft: false
          prerelease: false
      
      - name: Upload APK to Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app-*.apk
          asset_name: bizu-do-cadete-v${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
