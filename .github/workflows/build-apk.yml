name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo CLI
        run: npm install -g eas-cli
      
      - name: Build APK with EAS
        run: eas build --platform android --type apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: Download APK
        run: |
          mkdir -p ./build
          # EAS salva o APK em um local específico
          find ~/.eas -name "*.apk" -type f -exec cp {} ./build/ \;
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            APK gerado automaticamente via GitHub Actions
            
            **Alterações:**
            - Preço de assinatura: R$ 5,00/mês
            - Tela de login atualizada
            - Múltiplas formas de pagamento
            
            Baixe o APK abaixo e instale no seu dispositivo Android.
          draft: false
          prerelease: false
      
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/app-*.apk
          asset_name: bizu-do-cadete-v${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
